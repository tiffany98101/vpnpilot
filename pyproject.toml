[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vpnpilot"
version = "0.1.0"
description = "Unofficial tray UI for the ProtonVPN CLI on Linux"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Tiffany von Arnim", email = "tiffany.vonarnim@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
]
dependencies = [
    "PyQt6>=6.6",
    "qasync>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
vpnpilot = "vpnpilot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vpnpilot*"]

[tool.setuptools.package-data]
vpnpilot = ["resources/*.svg"]
"vpnpilot._vendor.qasync" = ["*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
